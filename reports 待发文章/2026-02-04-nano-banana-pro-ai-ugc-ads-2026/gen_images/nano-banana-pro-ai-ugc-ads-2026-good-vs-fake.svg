<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.24"/>
    </filter>
    <style>
      .title{font:800 40px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#053B2F}
      .subtitle{font:500 18px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#064E3B}
      .card{fill:rgba(255,255,255,0.86);stroke:rgba(6,95,70,0.26);stroke-width:2;rx:26}
      .head{font:800 20px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif}
      .ok{fill:#065F46}
      .bad{fill:#7F1D1D}
      .item{font:600 15px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#0F3D31}
      .hint{font:500 13px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#0F3D31;opacity:0.85}
      .tick{fill:#065F46}
      .x{fill:#B91C1C}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#bg3)"/>

  <rect x="70" y="56" width="1060" height="118" rx="26" fill="rgba(255,255,255,0.72)" filter="url(#shadow3)"/>
  <text x="100" y="118" class="title">Good vs “Fake” Product‑in‑Hand (Checklist)</text>
  <text x="100" y="150" class="subtitle">If the right column shows up, fix the still before generating video.</text>

  <g filter="url(#shadow3)">
    <rect class="card" x="90" y="220" width="510" height="520" rx="26"/>
    <rect class="card" x="600" y="220" width="510" height="520" rx="26"/>

    <text x="130" y="270" class="head ok">✅ Good (Believable)</text>
    <text x="640" y="270" class="head bad">❌ Fake (Pasted / AI‑ish)</text>

    <!-- Left list -->
    <circle cx="130" cy="315" r="10" class="tick"/><text x="155" y="320" class="item">Contact shadow under product</text>
    <text x="155" y="342" class="hint">Product touches palm/fingers visibly</text>

    <circle cx="130" cy="385" r="10" class="tick"/><text x="155" y="390" class="item">Finger occlusion on edges</text>
    <text x="155" y="412" class="hint">Fingers overlap product contours naturally</text>

    <circle cx="130" cy="455" r="10" class="tick"/><text x="155" y="460" class="item">Lighting direction consistent</text>
    <text x="155" y="482" class="hint">Highlights + shadows agree with scene</text>

    <circle cx="130" cy="525" r="10" class="tick"/><text x="155" y="530" class="item">Label readable, not warped</text>
    <text x="155" y="552" class="hint">Text stays straight at feed size</text>

    <circle cx="130" cy="595" r="10" class="tick"/><text x="155" y="600" class="item">Scale matches hand geometry</text>
    <text x="155" y="622" class="hint">No “too big / too small” mismatch</text>

    <!-- Right list -->
    <rect x="630" y="305" width="20" height="20" rx="4" class="x"/><text x="660" y="320" class="item">No shadow (floating product)</text>
    <text x="660" y="342" class="hint">Looks pasted on top of the hand</text>

    <rect x="630" y="375" width="20" height="20" rx="4" class="x"/><text x="660" y="390" class="item">Broken fingers / extra digits</text>
    <text x="660" y="412" class="hint">Hands “melt” at knuckles or nails</text>

    <rect x="630" y="445" width="20" height="20" rx="4" class="x"/><text x="660" y="460" class="item">Mismatched highlights</text>
    <text x="660" y="482" class="hint">Product has a different “sun” than the scene</text>

    <rect x="630" y="515" width="20" height="20" rx="4" class="x"/><text x="660" y="530" class="item">Label drift / letter wobble</text>
    <text x="660" y="552" class="hint">Text changes between frames/angles</text>

    <rect x="630" y="585" width="20" height="20" rx="4" class="x"/><text x="660" y="600" class="item">Perspective mismatch</text>
    <text x="660" y="622" class="hint">Product looks “flat” vs selfie lens</text>
  </g>
</svg>

