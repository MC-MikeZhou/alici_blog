<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#053B2F}
      .subtitle{font:500 18px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#064E3B}
      .box{fill:rgba(255,255,255,0.86);stroke:rgba(6,95,70,0.28);stroke-width:2;rx:18}
      .label{font:700 16px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#064E3B}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#0F3D31}
      .arrow{stroke:#065F46;stroke-width:4;opacity:0.7;fill:none;stroke-linecap:round}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <rect x="60" y="48" width="1080" height="108" rx="24" fill="rgba(255,255,255,0.72)" filter="url(#shadow)"/>
  <text x="88" y="105" class="title">Nano Banana Pro → Hyper‑Real AI UGC Ads (2026)</text>
  <text x="88" y="138" class="subtitle">Realism‑first pipeline: phone‑selfie actor → product‑in‑hand → talking clip → end card → variations</text>

  <!-- Pipeline boxes -->
  <g filter="url(#shadow)">
    <rect class="box" x="80" y="210" width="190" height="92" rx="18"/>
    <text class="label" x="110" y="247">Angle</text>
    <text class="small" x="110" y="271">One idea</text>
    <text class="small" x="110" y="291">One proof</text>

    <rect class="box" x="305" y="210" width="190" height="92" rx="18"/>
    <text class="label" x="335" y="247">Script</text>
    <text class="small" x="335" y="271">Hook → proof → CTA</text>
    <text class="small" x="335" y="291">20–35 seconds</text>

    <rect class="box" x="530" y="210" width="190" height="92" rx="18"/>
    <text class="label" x="560" y="247">Actor (Selfie)</text>
    <text class="small" x="560" y="271">Phone camera feel</text>
    <text class="small" x="560" y="291">Natural skin texture</text>

    <rect class="box" x="755" y="210" width="190" height="92" rx="18"/>
    <text class="label" x="785" y="247">Product Refs</text>
    <text class="small" x="785" y="271">Multi‑angle pack</text>
    <text class="small" x="785" y="291">Label consistent</text>

    <rect class="box" x="980" y="210" width="140" height="92" rx="18"/>
    <text class="label" x="1006" y="247">In‑Hand</text>
    <text class="small" x="1006" y="271">Shadows</text>
    <text class="small" x="1006" y="291">Occlusion</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M270 256 L305 256"/>
  <path class="arrow" d="M495 256 L530 256"/>
  <path class="arrow" d="M720 256 L755 256"/>
  <path class="arrow" d="M945 256 L980 256"/>

  <g filter="url(#shadow)">
    <rect class="box" x="150" y="365" width="260" height="100" rx="18"/>
    <text class="label" x="180" y="404">Talking Clip</text>
    <text class="small" x="180" y="428">6–10s beats first</text>
    <text class="small" x="180" y="448">Keep product stable</text>

    <rect class="box" x="470" y="365" width="260" height="100" rx="18"/>
    <text class="label" x="500" y="404">Motion End Card</text>
    <text class="small" x="500" y="428">Clear offer + CTA</text>
    <text class="small" x="500" y="448">Simple motion design</text>

    <rect class="box" x="790" y="365" width="260" height="100" rx="18"/>
    <text class="label" x="820" y="404">Variations</text>
    <text class="small" x="820" y="428">Hooks / captions / CTA</text>
    <text class="small" x="820" y="448">Ship 3–6 tests</text>
  </g>

  <path class="arrow" d="M410 415 L470 415"/>
  <path class="arrow" d="M730 415 L790 415"/>

  <rect x="60" y="530" width="1080" height="62" rx="18" fill="rgba(255,255,255,0.72)"/>
  <text x="88" y="568" class="small">Tip: If it looks fake, fix hands + product lighting/occlusion before changing the edit.</text>
</svg>

