<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052E24"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.24"/>
    </filter>
    <style>
      .title{font:800 40px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#053B2F}
      .subtitle{font:500 18px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#064E3B}
      .card{fill:rgba(255,255,255,0.86);stroke:rgba(6,95,70,0.26);stroke-width:2;rx:20}
      .label{font:800 18px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#064E3B}
      .text{font:500 14px -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;fill:#0F3D31}
      .pill{fill:rgba(16,185,129,0.18);stroke:rgba(6,95,70,0.25);stroke-width:1.5;rx:999}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#bg2)"/>

  <rect x="70" y="56" width="1060" height="118" rx="26" fill="rgba(255,255,255,0.72)" filter="url(#shadow2)"/>
  <text x="100" y="118" class="title">Realism Stack (AI UGC Ads)</text>
  <text x="100" y="150" class="subtitle">If one layer fails, the whole ad reads as “synthetic.” Fix top‑down.</text>

  <g filter="url(#shadow2)">
    <rect class="card" x="140" y="220" width="920" height="470" rx="26"/>

    <rect class="pill" x="190" y="265" width="820" height="54"/>
    <text class="label" x="220" y="299">1) Camera Language</text>
    <text class="text" x="520" y="299">phone selfie, front camera, handheld micro‑shake</text>

    <rect class="pill" x="190" y="335" width="820" height="54"/>
    <text class="label" x="220" y="369">2) Skin + Face Texture</text>
    <text class="text" x="520" y="369">pores, natural light, no beauty filter</text>

    <rect class="pill" x="190" y="405" width="820" height="54"/>
    <text class="label" x="220" y="439">3) Hands</text>
    <text class="text" x="520" y="439">correct fingers, believable grip, no melting knuckles</text>

    <rect class="pill" x="190" y="475" width="820" height="54"/>
    <text class="label" x="220" y="509">4) Product Integration</text>
    <text class="text" x="520" y="509">scale, shadows, occlusion, label consistency</text>

    <rect class="pill" x="190" y="545" width="820" height="54"/>
    <text class="label" x="220" y="579">5) Motion + Audio</text>
    <text class="text" x="520" y="579">short beats first (6–10s), natural pauses, room tone</text>

    <rect class="pill" x="190" y="615" width="820" height="54"/>
    <text class="label" x="220" y="649">6) Edit + End Card</text>
    <text class="text" x="520" y="649">captions, pacing, clear CTA (motion end card)</text>
  </g>
</svg>

