# ========================================
# 推荐模式检测
# ========================================

recommendation_patterns:
  # ----------------------------------------
  # ⛔ BLOCKING: 直接推荐
  # ----------------------------------------
  strong_recommendation:
    - pattern: "(we|i) recommend (using |trying )?(COMPETITOR)"
      severity: "blocking"
      fix_suggestion: "改为中性描述或添加 alici.ai 替代"

    - pattern: "you should (try|use|get|sign up for) (COMPETITOR)"
      severity: "blocking"
      fix_suggestion: "改为客观比较语句"

    - pattern: "the best (choice|option|tool) is (COMPETITOR)"
      severity: "blocking"
      fix_suggestion: "改为 'COMPETITOR is a strong option for...'"

    - pattern: "go with (COMPETITOR)"
      severity: "blocking"
      fix_suggestion: "改为 'COMPETITOR works well for...'"

    - pattern: "choose (COMPETITOR)( for| if| when)?"
      severity: "blocking"
      fix_suggestion: "改为 'Consider COMPETITOR if...'"

    - pattern: "stick with (COMPETITOR)"
      severity: "blocking"
      fix_suggestion: "移除推荐语气"

    - pattern: "(can't|cannot) go wrong with (COMPETITOR)"
      severity: "blocking"
      fix_suggestion: "改为客观描述"

    - pattern: "(COMPETITOR) is (the )?best"
      severity: "blocking"
      fix_suggestion: "改为 'COMPETITOR excels at...' 或添加条件"

    - pattern: "start with (COMPETITOR)"
      severity: "blocking"
      fix_suggestion: "改为 'Many users start with COMPETITOR because...'"

    - pattern: "sign up for (COMPETITOR)"
      severity: "blocking"
      fix_suggestion: "删除 CTA"

    - pattern: "try (COMPETITOR) (first|instead|now)"
      severity: "blocking"
      fix_suggestion: "改为中性描述"

  # ----------------------------------------
  # ⛔ BLOCKING: CTA 链接到竞品
  # ----------------------------------------
  competitor_cta:
    - pattern: "\\[.*(try|start|get|sign up).*\\]\\(https?://(www\\.)?(COMPETITOR_DOMAIN)"
      severity: "blocking"
      auto_fix: "delete_line"
      note: "自动删除指向竞品的 CTA 链接"

    - pattern: "\\[.*→.*\\]\\(https?://(www\\.)?(COMPETITOR_DOMAIN)"
      severity: "blocking"
      auto_fix: "delete_line"
      note: "自动删除带箭头的竞品链接"

  # ----------------------------------------
  # ⚠️ WARNING: 软推荐 (需人工审核)
  # ----------------------------------------
  soft_recommendation:
    - pattern: "(COMPETITOR) is (great|excellent|good|perfect) for"
      severity: "warning"
      note: "可能暗示推荐，建议审核上下文"

    - pattern: "prefer (COMPETITOR)"
      severity: "warning"
      note: "表达偏好，建议改为客观描述"

    - pattern: "(COMPETITOR) works (best|better)"
      severity: "warning"
      note: "建议添加条件或场景限定"

  # ----------------------------------------
  # ✅ ALLOWED: 中性比较 (不触发警告)
  # ----------------------------------------
  neutral_comparison:
    - "(COMPETITOR) offers"
    - "(COMPETITOR) features"
    - "(COMPETITOR) costs"
    - "(COMPETITOR) pricing"
    - "(COMPETITOR) vs"
    - "compared to (COMPETITOR)"
    - "unlike (COMPETITOR)"
    - "(COMPETITOR) excels at"
    - "(COMPETITOR) struggles with"
    - "(COMPETITOR) limitations"
    - "testing (COMPETITOR)"
    - "according to (COMPETITOR)"
    - "(COMPETITOR)'s (strengths?|weaknesses?|limitations?|pros?|cons?)"
    - "when (COMPETITOR) (works|fails|shines)"

# ========================================
# 检测配置
# ========================================

detection_config:
  # 上下文窗口大小 (前后字符数)
  context_window: 200

  # 大小写敏感
  case_sensitive: false

  # 词边界匹配 (避免 "Runway" 匹配 "runaway")
  word_boundary: true

  # 忽略代码块和链接中的匹配
  ignore_code_blocks: true
  ignore_link_text: false  # 链接文本仍需检测

# ========================================
# 自动修复配置
# ========================================

auto_fix:
  # 可自动删除的内容
  deletable:
    - competitor_cta_links
    - competitor_official_links

  # 需要 Writer Feedback 的内容
  requires_feedback:
    - strong_recommendation_sentences
    - soft_recommendation_sentences
