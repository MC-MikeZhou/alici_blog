# Internal Language Patterns v1.0
# 内部语言泄露检测规则
# 用于 Human Review Checklist Module 10: Internal Language Leak Check

version: "1.0"
last_updated: "2026-02-01"

# ========================================
# 核心理念
# ========================================

core_principle: >
  读者打开文章是为了解决问题，不是为了看编辑流程。
  任何"写给编辑/写给AI"而不是"写给读者"的内容都应该删除。

# ========================================
# 检测类型 1: 编辑注释泄露 ⛔ BLOCKING
# ========================================

editor_notes:
  severity: "blocking"
  description: "暴露内部编辑/版本/写作流程的内容"

  patterns:
    # 版本注释
    - pattern: "based on v\\d+"
      case_sensitive: false
      example: "Based on v3, this version..."
      problem: "读者不需要知道这是第几版"

    - pattern: "v\\d+\\s*(改进|版本|更新|修改)"
      example: "v2 改进了..."
      problem: "内部版本号泄露"

    # AI 痕迹
    - pattern: "AI-like writing"
      case_sensitive: false
      example: "changed several AI-like writing methods"
      problem: "暴露 AI 生成痕迹"

    - pattern: "(AI生成|AI写作|机器写作)"
      example: "修改了AI生成的内容"
      problem: "内部编辑说明"

    # 洗稿/参考模式
    - pattern: "reference expansion"
      example: "written as a 'reference expansion'"
      problem: "'reference expansion' 是内部洗稿术语"

    - pattern: "洗稿"
      example: "这是洗稿模式"
      problem: "内部术语泄露"

    # 编辑指令
    - pattern: "(编辑注释|编辑说明|内部说明)"
      example: "<!-- 编辑注释 -->"
      problem: "内部编辑注释"

  auto_fix:
    strategy: "delete_paragraph"
    note: "包含编辑注释的段落应完全删除"

# ========================================
# 检测类型 2: 内部术语泄露 ⛔ BLOCKING
# ========================================

internal_jargon:
  severity: "blocking"
  description: "读者不懂的行业/内部术语"

  patterns:
    # SEO/AEO 术语
    - pattern: "\\bAEO\\b"
      example: "AEO quick answers"
      problem: "'AEO' (Answer Engine Optimization) 是行业术语"
      replacement: "Quick Answers"

    - pattern: "\\bSERP\\b"
      example: "SERP ranking"
      problem: "'SERP' 是 SEO 术语"
      replacement: "search results"

    # 写作框架术语
    - pattern: "Data Hook"
      example: "Opening data hook (Data Hook)"
      problem: "'Data Hook' 是写作框架术语"
      replacement: null  # 删除，不替换

    - pattern: "\\bAIDA\\b"
      example: "AIDA framework"
      problem: "'AIDA' 是营销框架术语"
      replacement: null

    - pattern: "Citable Block"
      example: "这是一个 Citable Block"
      problem: "内部写作框架术语"
      replacement: null

    # E-E-A-T 术语 (可保留但需解释)
    - pattern: "\\bE-E-A-T\\b"
      example: "E-E-A-T signals"
      problem: "Google 术语，部分读者不熟悉"
      action: "explain_on_first_use"
      explanation: "Experience, Expertise, Authoritativeness, Trust"

  auto_fix:
    strategy: "replace_or_delete"
    note: "有替换词则替换，无替换词则删除相关短语"

# ========================================
# 检测类型 3: AI 设计暴露 ⛔ BLOCKING
# ========================================

ai_design_exposure:
  severity: "blocking"
  description: "暴露内容是为 AI 引用/抓取而设计的"

  patterns:
    - pattern: "easy for AI"
      example: "(easy for AI/readers to grasp)"
      problem: "暴露 AEO 优化意图"

    - pattern: "AI\\s*(can|could|will)\\s*(cite|quote|reference)"
      example: "so AI can cite this section"
      problem: "暴露 AI 引用优化"

    - pattern: "(为了让|方便)\\s*AI"
      example: "为了让AI能引用"
      problem: "暴露优化意图"

  auto_fix:
    strategy: "delete_phrase"
    note: "删除括号内的暴露内容，保留主体"

# ========================================
# 检测类型 4: H2 标题中的写作指导 ⚠️ WARNING
# ========================================

h2_writing_guidance:
  severity: "warning"
  description: "H2 标题后带有内部写作指导的括号"

  patterns:
    # 长括号 (>10 字符) 在 H2 标题中
    - pattern: "^##\\s+.+\\s+\\(.{10,}\\)$"
      multiline: true
      example: "## Why CTR matters (putting the problem into human terms)"
      problem: "括号内是给作者的写作目标，不是给读者的"

    # 常见写作指导短语
    - pattern: "\\(putting .+ into .+ terms\\)"
      example: "(putting the problem into human terms)"
      problem: "写作目标暴露"

    - pattern: "\\(explained in .+ language\\)"
      example: "(explained in creator's everyday language)"
      problem: "写作目标暴露"

    - pattern: "\\(one-step path\\)"
      example: "(one-step path)"
      problem: "内部结构注释"

    - pattern: "\\(\\d+ .+, .+\\)"
      example: "(four scenes, you can capture the key points)"
      problem: "内部结构说明"

    - pattern: "\\(the caliber remains the same\\)"
      example: "FAQ (the caliber remains the same)"
      problem: "编辑注释"

  auto_fix:
    strategy: "remove_parentheses"
    note: "删除 H2 标题中的括号及其内容"
    example:
      before: "## Why CTR matters (putting the problem into human terms)"
      after: "## Why CTR Matters"

# ========================================
# 检测类型 5: 结尾编辑元数据 ⚠️ WARNING
# ========================================

trailing_metadata:
  severity: "warning"
  description: "文章结尾的编辑/来源元数据"

  patterns:
    - pattern: "> Note: This article is written as"
      example: "> Note: This article is written as a 'reference expansion'..."
      problem: "内部编辑说明"

    - pattern: "(数据来源|信息来源)[:：]\\s*YouTube Studio"
      example: "数据来源: YouTube Studio"
      problem: "可保留，但不应在引用块中"

  auto_fix:
    strategy: "delete_or_move"
    note: "删除内部说明；数据来源可移到 Source Attribution 章节"

# ========================================
# 检测配置
# ========================================

detection_config:
  # 扫描范围
  scan_areas:
    - "title"
    - "opening_blockquote"  # 开头引用块
    - "h2_titles"
    - "full_text"
    - "trailing_blockquote"  # 结尾引用块

  # 大小写敏感
  case_sensitive: false

  # 忽略代码块
  ignore_code_blocks: true

  # 忽略 Source Attribution 章节
  ignore_sections:
    - "Source Attribution"
    - "References"
    - "Sources"

# ========================================
# 输出格式
# ========================================

output_format: |
  ### Module 10: Internal Language Leak Check

  **Scan Results**:
  | Type | Location | Content | Severity | Action |
  |------|----------|---------|----------|--------|
  | Editor Note | Line {n} | "{text}" | ⛔ BLOCKING | Delete |
  | Internal Jargon | Line {n} | "{term}" | ⛔ BLOCKING | Replace with "{replacement}" |
  | AI Design Exposure | Line {n} | "{text}" | ⛔ BLOCKING | Delete phrase |
  | H2 Writing Guidance | Line {n} | "{h2}" | ⚠️ WARNING | Remove parentheses |

  **Auto-Fix Applied**:
  - Deleted {n} editor notes
  - Replaced {n} internal terms
  - Cleaned {n} H2 titles

  **Status**: ✅ PASS / ⛔ BLOCKING (requires fix before publish)
